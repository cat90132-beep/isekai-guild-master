[preset.0]

name="GuildMaster"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, LICENSES/*.json, ui/symbols/sources.json, ui/app_icon.ico"
exclude_filter="art/*, rules/*, ui/bottons/*, reference/*"
export_path="../GuildMaster-new.pck"
script_export_mode=1
patch_pck=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=true
texture_format/etc2=true
binary_format/architecture="x86_64"
codesign/enable=false
application/allow_modify_mono_params=false
